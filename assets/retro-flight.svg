<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Animated all-green contribution flight path">
  <defs>
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" rx="2" fill="#39d353"/>
      <rect x="1.5" y="1.5" width="8" height="8" rx="1.5" fill="#7CFF6B" opacity=".52"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="route" d="M78 92H822V108H78V124H822V140H78V156H822V172H78"/>
  </defs>
  <rect width="900" height="260" rx="14" fill="#061b12"/>
  <rect x="18" y="18" width="864" height="224" rx="10" fill="#0a2e1d" stroke="#e27d60" stroke-width="2"/>
  <text x="42" y="52" fill="#e27d60" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2">ÖMER FARUK SARIKAYA // FLIGHT LOG</text>
  <text x="42" y="73" fill="#a8e6b7" font-family="monospace" font-size="11" letter-spacing="1.4">ALL SYSTEMS GREEN · AUTONOMOUS AI ENGINEER</text>
  <rect x="70" y="84" width="765" height="99" rx="8" fill="url(#grid)" opacity=".94"/>
  <path d="M78 92H822V108H78V124H822V140H78V156H822V172H78" fill="none" stroke="#e27d60" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>
  <g filter="url(#glow)">
    <circle r="12" fill="#e27d60" stroke="#fff2d9" stroke-width="2"/>
    <path d="M-10 1 L10 -5 L4 0 L10 5 L-10 -1 L-3 0 Z" fill="#061b12"/>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
  </g>
  <text x="42" y="213" fill="#e27d60" font-family="monospace" font-size="11" letter-spacing="1.2">LIVE ROUTE</text>
  <circle cx="135" cy="209" r="5" fill="#7CFF6B" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1s" repeatCount="indefinite"/></circle>
  <text x="153" y="213" fill="#a8e6b7" font-family="monospace" font-size="11">FILLING THE GRID, ONE PROJECT AT A TIME</text>
  <text x="858" y="213" fill="#e27d60" text-anchor="end" font-family="monospace" font-size="11">✈ 01</text>
</svg>
